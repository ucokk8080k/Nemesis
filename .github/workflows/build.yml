name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source if uploaded as zip
        run: |
          ZIP=$(ls Nemesis-source*.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP"
            cp -r Nemesis/. .
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: Nemesis-jar
          path: target/Nemesis-*.jar
